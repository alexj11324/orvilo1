name: Build and deploy orvilo1

# 生产部署管线。
#
# 构建、提升、部署三段分开是有意的：
#   - push 到 canary 只构建并推不可变的 sha-<commit> 镜像 —— 快，且能立刻发现构建坏了
#   - promote 等到该 commit 的 Required Quality Gate（test.yml）变绿后，才把
#     :canary / :main 浮动标签指过去 —— 测试未过或还在跑的提交永远不会成为生产候选
#   - 部署要手动 dispatch 时勾 deploy，同样先验门禁再按镜像 digest 部署
# 生产主机是共享的（同机还有 20+ 个其他产品的容器），所以每次上线都必须有
# 精确 SHA 的质量证据，不能拿浮动标签或旧提交的绿灯充数。
#
# canary 是开发主干，同时也是生产代码线；main 是发布快照。
# 完整模型见 docs/development/branch-model.md。

on:
  push:
    branches: [canary]
  workflow_dispatch:
    inputs:
      build:
        description: '手动触发时也构建镜像（用于部署非 canary 分支，分支没有 push 构建产物）'
        type: boolean
        default: false
      deploy:
        description: '构建完成后部署到生产主机'
        type: boolean
        default: false
      retag_main_from:
        description: '可选：把 :canary 浮动标签指到这个已有 sha-* 镜像（不动构建/部署，用于修正污染的标签）'
        required: false

permissions:
  contents: read
  packages: write
  checks: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  COMPOSE_DIR: /var/lib/orvilo1/docker-compose/deploy

jobs:
  retag-main:
    if: github.event_name == 'workflow_dispatch' && inputs.retag_main_from != ''
    runs-on: ubuntu-latest
    # 与 promote 串行：手动修标签不能和自动提升交错写同一批浮动标签。
    concurrency:
      group: orvilo1-image-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 手动 retag 也走同一道门禁：人工按钮不是绕过质量证据的后门。
      - name: Require the quality gate for the source commit
        uses: ./.github/actions/require-quality-gate
        with:
          sha: ${{ inputs.retag_main_from }}
          wait_seconds: '0'

      - name: Repoint the floating tag to an existing sha image
        env:
          # Passed through the environment rather than interpolated into the
          # script body: this value comes from a workflow_dispatch input, and
          # inlining it would let a crafted value break out of the quoting.
          SOURCE_SHA: ${{ inputs.retag_main_from }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:sha-${SOURCE_SHA}"
          docker buildx imagetools create \
            -t "${IMAGE}:canary" \
            -t "${IMAGE}:main" \
            "${IMAGE}:sha-${SOURCE_SHA}"
          echo ":canary and :main -> sha-${SOURCE_SHA}"

  build:
    # push 才构建。手动部署不需要重建 —— 镜像按 commit 不可变，同一个 sha
    # 的镜像内容必然相同，而一次 Next.js 生产构建要十几分钟。
    # 例外：workflow_dispatch 显式勾 build，用于给没有 push 构建产物的
    # 分支（验收部署等）产出 sha-<commit> 镜像。
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build && inputs.retag_main_from == '')
    # 部署目标是 aarch64，这里用 GitHub 的 arm64 runner 原生构建，
    # 不走 QEMU —— 那会让一次 Next.js 生产构建慢到不可接受。
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建只推不可变的 sha-<commit> 标签。:canary / :main 浮动标签改由
      # promote job 在该 commit 的 Required Quality Gate 变绿之后提升——
      # 测试没过的 commit 永远不会被浮动标签指向。
      - name: Compute tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 镜像 | \`${IMAGE}:sha-${SHA}\` |"
            echo "| 提交 | \`${SHA}\` |"
            echo "| digest | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    # 把 :canary / :main 浮动标签提升到刚构建的 sha 镜像——但只在该 commit
    # 的 Required Quality Gate 变绿之后。门禁失败/取消/超时都不会动标签。
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # 只有最新的 canary 提交值得完成提升：新 push 取消仍在等旧 commit 门禁的
    # 任务；同组串行保证标签按提交顺序前进，旧构建晚完成也不能让标签倒退。
    concurrency:
      group: orvilo1-image-promotion
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the quality gate on this commit
        uses: ./.github/actions/require-quality-gate
        with:
          sha: ${{ github.sha }}
          wait_seconds: '3600'

      - name: Promote floating tags to this commit's image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 等门禁期间 canary 可能又前进了：只有仍是分支尖端的 commit 才配
          # 拿浮动标签，否则留给更新的 promote 去指。
          tip=$(gh api "repos/${{ github.repository }}/branches/canary" --jq .commit.sha)
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "canary tip moved to $tip — this promote is superseded, leaving tags alone."
            exit 0
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:canary" \
            -t "${IMAGE}:main" \
            "${IMAGE}:sha-${GITHUB_SHA}"
          echo ":canary and :main -> sha-${GITHUB_SHA} (quality gate green)"

  deploy:
    # build 未勾选时它会被 skipped —— 部署已有镜像仍要允许；只有 build
    # 真跑了且失败时才不该部署。always() 让 skipped 不阻塞本 job。
    needs: build
    if: always() && github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.retag_main_from == '' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    # 生产部署串行：两次手动 deploy 不能交错 pull/up 同一批容器。
    concurrency:
      group: orvilo1-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 部署前置质量核验：人工 dispatch 不是绕过测试的后门。最多等 30 分钟
      # 让刚合入 commit 的 Test CI 收尾；失败、缺失或超时一律不部署。
      - name: Wait for the quality gate on this commit
        uses: ./.github/actions/require-quality-gate
        with:
          sha: ${{ github.sha }}
          wait_seconds: '1800'

      # 部署按 digest 固定而不是 sha-* 标签：标签可被后续 promote 移动，
      # digest 不会。从这里起源码 SHA ↔ 镜像 digest ↔ 门禁证据一一对应。
      - name: Resolve the pinned image digest
        id: image
        env:
          BUILT_DIGEST: ${{ needs.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${IMAGE}:sha-${SHA}"
          digest="$BUILT_DIGEST"
          if [ -z "$digest" ]; then
            # 部署已有镜像（本次 workflow 没构建）：digest 就是 registry 里
            # 存储的 manifest/index 字节流的 sha256。
            digest="sha256:$(docker buildx imagetools inspect "$tag" --raw | sha256sum | cut -d' ' -f1)"
          fi
          [ -n "$digest" ] && [ "$digest" != "sha256:" ] || { echo "::error::无法解析 $tag 的 digest"; exit 1; }
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### 部署镜像已固定"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 提交 | \`${SHA}\` |"
            echo "| 镜像 | \`${IMAGE}@${digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SHA: ${{ github.sha }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          # Deploy the image pinned by digest for this exact commit — not
          # :canary/:main (floating) and not even sha-<sha> (re-promotable).
          # What the host pulls is byte-identical to what the gate verified.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$SSH_HOST" "
            docker manifest inspect '$IMAGE_REF' >/dev/null 2>&1 || {
              echo \"镜像 $IMAGE_REF 不存在：该 commit 的 push 构建可能还没跑完，或已失败。\" >&2
              exit 1
            }
          "
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$SSH_HOST" \
            'sudo docker stop orvilo-hatchet-worker 2>/dev/null || true'
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$SSH_HOST" \
            "cd $COMPOSE_DIR && \
             sudo ORVILO_IMAGE_TAG='$IMAGE_REF' docker compose -f docker-compose.yml -f orvilo1-production.override.yml pull orvilo hatchet-worker"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$SSH_HOST" \
            "cd $COMPOSE_DIR && \
             sudo ORVILO_IMAGE_TAG='$IMAGE_REF' docker compose -f docker-compose.yml -f orvilo1-production.override.yml up -d orvilo"

      - name: Verify
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -euo pipefail
          # 迁移在容器启动时跑，失败会 exit 1，所以要等日志里出现通过标记
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$SSH_HOST" \
                 'sudo docker logs orvilo 2>&1 | tail -60' | grep -q 'migration pass'; then
              echo "migration 通过"
              break
            fi
            [ "$i" = 30 ] && { echo "超时：未看到 migration pass"; exit 1; }
            sleep 6
          done
          # Start the worker only after the app container has completed its
          # database migrations. This prevents Hatchet cron/sweep tasks from
          # reaching new dispatch tables before they exist.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$SSH_HOST" \
            "cd $COMPOSE_DIR && \
             sudo ORVILO_IMAGE_TAG='${{ steps.image.outputs.ref }}' docker compose -f docker-compose.yml -f orvilo1-production.override.yml up -d hatchet-worker"
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$SSH_HOST" \
                 'sudo docker logs orvilo-hatchet-worker 2>&1 | tail -80' | grep -Eiq 'worker .* listening for actions'; then
              echo "Hatchet worker 已注册"
              break
            fi
            [ "$i" = 30 ] && { echo "超时：Hatchet worker 未注册"; exit 1; }
            sleep 6
          done
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$SSH_HOST" \
            'curl -fsS --max-time 20 http://127.0.0.1:3210/api/version'
