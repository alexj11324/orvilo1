name: Preview E2E

# 与 preview-smoke 同一触发时机，但跑完整的 @P0 用户旅程套件。
# 需要 secrets：PREVIEW_DATABASE_URL、VERCEL_AUTOMATION_BYPASS_SECRET、
# ORACLE_HOST、ORACLE_SSH_KEY、ORACLE_SSH_KNOWN_HOSTS。

on:
  deployment_status: {}
  workflow_dispatch:
    inputs:
      base_url:
        description: Existing orvilo1 Vercel deployment URL to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Smoke and full E2E share the small Preview PostgreSQL instance. Queue both
  # suites for this deployment without cancelling either one.
  group: preview-validation-${{ github.event.deployment.id || inputs.base_url }}
  cancel-in-progress: false

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment, 'Preview'))
    name: E2E test Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ inputs.base_url || github.event.deployment_status.target_url }}
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Validate manual Preview URL
        if: github.event_name == 'workflow_dispatch'
        run: |
          preview_url="${BASE_URL%/}"
          if [[ ! "$preview_url" =~ ^https://orvilo1-[a-z0-9]+-alexs-projects-078b8b0b\.vercel\.app$ ]]; then
            echo "base_url must be an immutable orvilo1 deployment URL" >&2
            exit 1
          fi
          echo "BASE_URL=$preview_url" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        run: pnpm install

      - name: Setup Preview database tunnel
        uses: ./.github/actions/setup-preview-db-tunnel
        with:
          database-url: ${{ secrets.PREVIEW_DATABASE_URL }}
          oracle-host: ${{ secrets.ORACLE_HOST }}
          oracle-known-hosts: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          oracle-ssh-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Install Playwright browsers (with system deps)
        run: bunx playwright install --with-deps chromium

      - name: Check preview environment
        run: bun scripts/ci/checkPreviewEnv.mts

      - name: Run E2E tests
        working-directory: e2e
        run: pnpm exec cucumber-js --config cucumber.config.js --tags '@P0'
        env:
          E2E_PARALLEL: '1'
          E2E_REPORTS: '0'
          HEADLESS: 'true'

      - name: Upload E2E test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: preview-e2e-artifacts
          path: |
            e2e/reports
            e2e/screenshots
          if-no-files-found: ignore
