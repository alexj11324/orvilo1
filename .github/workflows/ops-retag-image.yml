name: Retag GHCR image

# Ops utility: point a floating tag at an existing immutable sha-* image
# without rebuilding (e.g. restore :main, roll back a release tag).
# Runs entirely registry-side via docker buildx imagetools create.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing tag to copy from (e.g. sha-<full commit>)'
        required: true
      target_tag:
        description: 'Floating tag to (re)point (e.g. main, latest)'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source image exists
        run: docker buildx imagetools inspect "$IMAGE:${{ inputs.source_tag }}"

      - name: Retag
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ inputs.target_tag }}" \
            "$IMAGE:${{ inputs.source_tag }}"
          echo "== $IMAGE:${{ inputs.target_tag }} now points to sha-${{ inputs.source_tag }} manifest =="
          docker buildx imagetools inspect "$IMAGE:${{ inputs.target_tag }}" | head -20
