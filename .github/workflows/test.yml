  # Single required check for branch protection and deploy promotion. Branch
  # rules require this one name, so "the tests passed" can never mean "one
  # shard was green while another failed" — a job that failed, was skipped, or
  # never ran keeps the gate red.
  # MAINTENANCE: adding a CI job above requires updating both `needs` here
  # and the `required` list in the step below — a job absent from both is
  # silently excluded from the gate.

      - name: Fail fast — cancel sibling jobs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  required-quality-gate:
    name: Required Quality Gate
    needs:
      - check-duplicate-run
      - changes
      - typecheck
      - slimming-boundary
      - test-packages
      - test-app
      - test-windows-shell
      - test-desktop
      - test-server
      - test-database
      - merge-app-coverage
      - merge-server-coverage
    # always(): a failed upstream must not skip this job — its result IS the
    # failure signal branch protection and the deploy pipeline read.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded for this commit
        env:
          NEEDS: ${{ toJson(needs) }}
          GH_TOKEN: ${{ github.token }}
          # How long a duplicate-skipped gate waits for the owning run's
          # verdict before failing closed. Must exceed the full test suite.
          GATE_MIRROR_TIMEOUT: '2700'
          # pull_request runs evaluate the merge ref — gate check runs for the
          # owning push run live on the head SHA.
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Only `skip_after_successful_duplicate` may turn the gate green: it
          # means an identical tree already produced a genuinely-executed green
          # run, whose check run covers this SHA. Concurrent skips
          # (`same_content*`/`outdated_*`) mean a newer in-flight run owns the
          # gate — failing here would leave a permanent red check run on this
          # SHA that outlives the owner's green (required checks take the
          # latest completed run per name), and a synthetic success would let a
          # later `skip_after_successful_duplicate` reuse it even if the real
          # run then fails. So wait for the owner's verdict and mirror it:
          # green mirrors green, red mirrors red, no verdict in time fails.
          if [ "$(echo "$NEEDS" | jq -r '.["check-duplicate-run"].outputs.should_skip')" = "true" ]; then
            reason="$(echo "$NEEDS" | jq -r '.["check-duplicate-run"].outputs.skip_reason')"
            echo "Duplicate skip reason: ${reason:-unknown}"
            if [ "$reason" = "skip_after_successful_duplicate" ]; then
              echo "An identical run already executed green for this SHA's tree — reusing its gate."
              exit 0
            fi
            echo "Concurrent duplicate skip — waiting for the owning run's Required Quality Gate verdict."
            deadline=$(( $(date +%s) + GATE_MIRROR_TIMEOUT ))
            while :; do
              # This job's own check run is still in_progress (conclusion null)
              # and never matches the filter. A 'cancelled'/'neutral' verdict
              # is not a verdict — it usually means an even newer run started,
              # so keep waiting rather than mirroring a non-answer.
              if ! verdict=$(gh api \
                "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "Required Quality Gate" and .conclusion != null)]
                      | map(select(.conclusion == "success" or .conclusion == "failure"
                          or .conclusion == "timed_out" or .conclusion == "action_required"))
                      | sort_by(.completed_at) | last | .conclusion // ""' 2>&1); then
                echo "Check-runs API call failed; retrying in 30s: $verdict"
                verdict=''
              fi
              case "$verdict" in
                success)
                  echo "Owning run's gate succeeded — mirroring green."
                  exit 0
                  ;;
                failure|timed_out|action_required)
                  echo "::error::Owning run's gate concluded '${verdict}' — mirroring the failure."
                  exit 1
                  ;;
              esac
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for the owning run's Required Quality Gate verdict — failing closed."
                exit 1
              fi
              echo "Owning run's gate not concluded yet; waiting 30s…"
              sleep 30
            done
          fi

          required=(
            typecheck
            slimming-boundary
            test-packages
            test-app
            test-windows-shell
            test-desktop
            test-server
            test-database
            merge-app-coverage
            merge-server-coverage
          )
          # A job skipped because its area filter did not match is a pass —
          # any other non-success keeps the gate red.
          declare -A area_of=(
            [typecheck]=code [slimming-boundary]=code [test-packages]=packages [test-app]=app
            [merge-app-coverage]=app [test-windows-shell]=windows_shell
            [test-desktop]=desktop [test-server]=server
            [merge-server-coverage]=server [test-database]=database
          )
          failed=0
          for job in "${required[@]}"; do
            result=$(echo "$NEEDS" | jq -r ".[\"$job\"].result")
            area=${area_of[$job]}
            filter=$(echo "$NEEDS" | jq -r ".changes.outputs.${area} // \"\"")
            if [ "$result" != "success" ] && ! { [ "$result" = "skipped" ] && [ "$filter" = "false" ]; }; then
              echo "::error::$job: $result (filter ${area}=${filter})"
              failed=1
            else
              echo "$job: $result (filter ${area}=${filter})"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Required jobs failed or were skipped — quality gate stays red."
            exit 1
          fi
