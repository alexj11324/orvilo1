name: Exact CSS 690 compiler proof
on:
  push:
    branches: ['refactor/native-ui-sdk-removal-batch']
    paths:
      - 'tests/exact-css690/**'
      - '.github/workflows/exact-css690.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character candidate commit; whole compiler scope only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: exact-css690-${{ inputs.revision || github.sha }}
  cancel-in-progress: false
jobs:
  whole-exact-css:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          # Checkout's existing read-only job credential permits the following
          # normal Git fetches; no new token or copied session credential.
          persist-credentials: true
      - name: Validate exact candidate and fetch all real historical refs
        env:
          EXPECTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          python3 tests/exact-css690/fetch_history.py --root "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-env
      - name: Install declared dependencies with normal lifecycle scripts
        run: pnpm install --no-frozen-lockfile
      - name: Check unchanged guard logic and actual finite-ancestor platform cases
        run: |
          python3 tests/exact-css690/source_pin_test.py
          python3 tests/exact-css690/guard_resource_test.py
      - name: Bind exact checkout and self-contained original917 inputs
        env:
          EXPECTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          python3 tests/exact-css690/prepare.py --root "$GITHUB_WORKSPACE" \
            --revision "$EXPECTED_REVISION" --output "$RUNNER_TEMP/exact-css690-packet"
      - name: Execute original whole compiler under unchanged original guards
        run: |
          NODE="$(command -v node)"
          sudo systemd-run --scope --property=MemoryAccounting=yes --property=MemoryMax=12G \
            runuser -u "$(id -un)" -- env PATH="$PATH" \
            python3 "$RUNNER_TEMP/exact-css690-packet/execute.py" \
            --node "$NODE" --output "$RUNNER_TEMP/exact-css690-results" \
            --lease "GH_690_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
      - name: Upload actual proof or complete HOLD artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-css690-${{ inputs.revision || github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exact-css690-results/
            ${{ runner.temp }}/exact-css690-packet/binding.json
            ${{ runner.temp }}/exact-css690-packet/seal.json
            ${{ runner.temp }}/exact-css690-packet/source-manifest.json
          retention-days: 14
