name: UI alignment

on:
  # Push path filters see only the last push. The cheap planner below uses the
  # cumulative branch diff, so a docs follow-up cannot hide a broken UI change.
  push: {}
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/features/**'
      - 'src/app/globals.css'
      - 'tests/ui-alignment/**'
      - 'postcss.config.mjs'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - '.github/actions/setup-env/**'
      - '.github/workflows/ui-alignment.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ui-alignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect browser geometry changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.plan.outputs.ui }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: plan
        env:
          FORCE_UI: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node .github/scripts/run-ci-plan.mjs
          if [ "$FORCE_UI" = true ]; then echo 'ui=true' >> "$GITHUB_OUTPUT"; fi
  alignment:
    needs: changes
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Push owns browser geometry' || 'Browser geometry' }}
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env
      - run: pnpm install --frozen-lockfile
      - name: Build authorization SPA for Electron verification
        run: bun run build:spa:auth
      - name: Upload authorization SPA
        uses: actions/upload-artifact@v4
        with:
          name: auth-spa-${{ github.sha }}
          path: dist/auth/
          retention-days: 14
      - name: Typecheck browser tests
        run: pnpm exec node scripts/type-check.mjs tsgo --noEmit -p tests/ui-alignment/tsconfig.json
      - run: pnpm exec playwright install --with-deps chromium
      - name: Record tested revision
        run: git rev-parse HEAD > ui-alignment-revision.txt
      - name: Measure production components in Chromium
        env:
          UI_ALIGNMENT_SHA: ${{ github.sha }}
        run: bun run test:ui-alignment
      - name: Upload screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-alignment-${{ github.sha }}
          path: |
            test-results/ui-alignment/
            test-results/ui-alignment-report/
            ui-alignment-revision.txt
          retention-days: 14
