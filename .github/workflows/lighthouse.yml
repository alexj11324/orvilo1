name: Lighthouse Badger

# NOTE: disabled for now. Before enabling it:
#   1. create a `lighthouse` branch to hold the badges. The inherited config
#      pointed at `aspectlylabs/orvilo`, a repository that does not exist, so
#      the checkout could never have succeeded.
#   2. provide GH_TOKEN with push access — the nightly badge commit lands on
#      that branch, and the built-in token is not used here.
env:
  TOKEN_NAME: 'GH_TOKEN'
  REPO_BRANCH: 'alexj11324/orvilo1 lighthouse'
  USER_NAME: 'orvilobot'
  USER_EMAIL: 'i@orvilo.aspectlylabs.com'
  AUDIT_TYPE: 'both'
  MOBILE_LIGHTHOUSE_PARAMS: '--throttling.cpuSlowdownMultiplier=2'
  DESKTOP_LIGHTHOUSE_PARAMS: '--preset=desktop --throttling.cpuSlowdownMultiplier=1'
  COMMIT_MESSAGE: '🤖 chore: Lighthouse Results Refreshed'

on:
  schedule:
    - cron: '0 0 * * *' # every day
  workflow_dispatch: {}

jobs:
  lighthouse-badger-advanced:
    name: ${{ matrix.NAME }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - NAME: 'Orvilo | Chat'
            URLS: 'https://orvilo.aspectlylabs.com/chat'
            BADGES_ARGS: '-b pagespeed -o lighthouse/chat -r'
            COMMIT_MESSAGE: '🤖 chore: Lighthouse Results | Chat'
          - NAME: 'Orvilo | Market'
            URLS: 'https://orvilo.aspectlylabs.com/discover'
            BADGES_ARGS: '-b pagespeed -o lighthouse/discover -r'
            COMMIT_MESSAGE: '🤖 chore: Lighthouse Results | Discover'

    steps:
      - name: Preparatory Tasks
        run: |
          REPOSITORY=`expr "${{ env.REPO_BRANCH }}" : "\([^ ]*\)"`
          BRANCH=`expr "${{ env.REPO_BRANCH }}" : ".* \([^ ]*\)"`
          echo "REPOSITORY=$REPOSITORY" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        env:
          REPO_BRANCH: ${{ env.REPO_BRANCH }}
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.REPOSITORY }}
          token: ${{ secrets[env.TOKEN_NAME] }}
          ref: ${{ env.BRANCH }}
      - uses: actions/checkout@v6
        with:
          repository: 'myactionway/lighthouse-badges'
          path: temp_lighthouse_badges_nested
      - uses: myactionway/lighthouse-badger-action@v2.2
        with:
          urls: ${{ matrix.URLS }}
          badges_args: ${{ matrix.BADGES_ARGS }}
          audit_type: ${{ env.AUDIT_TYPE }}
          mobile_lighthouse_params: ${{ env.MOBILE_LIGHTHOUSE_PARAMS }}
          desktop_lighthouse_params: ${{ env.DESKTOP_LIGHTHOUSE_PARAMS }}
          user_name: ${{ env.USER_NAME }}
          user_email: ${{ env.USER_EMAIL }}
          commit_message: ${{ matrix.COMMIT_MESSAGE || env.COMMIT_MESSAGE }}
          max_push_attempts: 5
