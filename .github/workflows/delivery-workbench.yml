name: Delivery Implementation Workbench

on:
  push:
    branches: [work/delivery-control-plane]
    paths:
      - .github/workflows/delivery-workbench.yml
      - scripts/delivery-workbench.py

permissions:
  contents: read

concurrency:
  group: delivery-implementation-workbench
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read exact authorized repository snapshot
        env:
          REF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/alexj11324/orvilo1.git
          git fetch --no-tags --depth=1 origin "$REF_SHA"
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/delivery-source
          git rev-parse HEAD > /tmp/delivery-source/main-sha.txt
          git archive --format=tar.gz HEAD > /tmp/delivery-source/main.tar.gz
          git fetch --no-tags --depth=1 origin refs/pull/25/head
          git rev-parse FETCH_HEAD > /tmp/delivery-source/pr25-sha.txt
          git archive --format=tar.gz FETCH_HEAD > /tmp/delivery-source/pr25.tar.gz
      - name: Preserve source-only implementation snapshots
        uses: actions/upload-artifact@v4
        with:
          name: delivery-source
          path: /tmp/delivery-source/
          retention-days: 3
          if-no-files-found: error
