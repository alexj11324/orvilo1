name: Documentation gate tests

on:
  pull_request:
    paths:
      - '.github/scripts/require-docs-for-functional-changes.mjs'
      - '.github/scripts/require-docs-for-functional-changes.test.mjs'
      - '.github/workflows/documentation-required.yml'
      - '.github/workflows/documentation-gate-tests.yml'
      - '.github/scripts/check-ui-ux-rules*.mjs'
      - 'DESIGN*.md'
      - 'AGENTS.md'
      - '.agents/skills/react/**'
      - '.agents/skills/ux/**'
      - '.agents/skills/design-system/**'
      - '.agents/skills/linear-design/SKILL.md'
      - '.agents/skills/linear-ui-parity/**'
      - '.agents/skills/clone-website-orvilo/references/orvilo-contract.md'
      - '.agents/skills/deep-review/references/dimensions/code-style.md'
      - 'skills-lock.json'
      - 'scripts/lint-staged-skip-packet.mjs'

permissions:
  contents: read

jobs:
  documentation-gate-tests:
    name: Documentation Gate Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run documentation gate tests
        run: node --test .github/scripts/require-docs-for-functional-changes.test.mjs

      - name: Check UI/UX rule ownership and regressions
        run: |
          node .github/scripts/check-ui-ux-rules.mjs
          node --test .github/scripts/check-ui-ux-rules.test.mjs
