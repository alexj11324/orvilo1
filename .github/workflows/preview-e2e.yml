name: Preview E2E

# 与 preview-smoke 一样只验证已由 Vercel API 确认的不可变 Preview URL，
# 但运行完整的 @P0 用户旅程套件。
# 需要 secrets：PREVIEW_DATABASE_URL、VERCEL_TOKEN、VERCEL_ORG_ID、
# VERCEL_PROJECT_ID、VERCEL_AUTOMATION_BYPASS_SECRET、
# ORACLE_HOST、ORACLE_SSH_KEY、ORACLE_SSH_KNOWN_HOSTS。

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Existing orvilo1 Vercel deployment URL to validate
        required: true
        type: string
      deployment_id:
        description: GitHub deployment ID created by vercel[bot] for base_url
        required: true
        type: string
      deployment_sha:
        description: Full Git commit SHA used to build that deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Smoke and full E2E share the small Preview PostgreSQL instance. Queue both
  # suites for this deployment without cancelling either one.
  group: preview-validation-${{ inputs.base_url }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E test Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Validate manual Preview URL
        id: validate-manual-preview
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EXPECTED_SHA: ${{ inputs.deployment_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          preview_url="${BASE_URL%/}"
          if [[ ! "$preview_url" =~ ^https://orvilo1-[a-z0-9]+-alexs-projects-078b8b0b\.vercel\.app$ ]]; then
            echo "base_url must be an immutable orvilo1 deployment URL" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deployment_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_DEPLOYMENT_ID" =~ ^[0-9]+$ ]]; then
            echo "deployment_id must be a numeric GitHub deployment ID" >&2
            exit 1
          fi
          deployment=$(curl -fsS \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${EXPECTED_DEPLOYMENT_ID}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28')
          statuses=$(curl -fsS \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${EXPECTED_DEPLOYMENT_ID}/statuses?per_page=100" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28')
          if ! jq -e --arg sha "$EXPECTED_SHA" '
            .sha == $sha and .environment == "Preview" and .creator.login == "vercel[bot]"
          ' <<< "$deployment" > /dev/null; then
            echo "GitHub deployment does not match the requested Vercel Preview commit" >&2
            exit 1
          fi
          if ! jq -e --arg url "$preview_url" '
            sort_by(.created_at) | last
            | .state == "success"
              and .environment == "Preview"
              and .creator.login == "vercel[bot]"
              and .environment_url == $url
              and .target_url == $url
          ' <<< "$statuses" > /dev/null; then
            echo "Vercel bot did not confirm the requested successful Preview URL" >&2
            exit 1
          fi
          echo "BASE_URL=$preview_url" >> "$GITHUB_ENV"
          printf 'deployment-ref=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Open trusted Preview database tunnel
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/orvilo-preview-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/id_ed25519" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ExitOnForwardFailure=yes -o IdentitiesOnly=yes -o ServerAliveCountMax=3 \
            -o ServerAliveInterval=30 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -fNT \
            -L 127.0.0.1:35432:127.0.0.1:25432 "ubuntu@$ORACLE_HOST"
          rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          rmdir "$ssh_dir"

      - name: Checkout validation workflow
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve Preview database URL
        id: resolve-preview-database
        uses: ./.github/actions/resolve-preview-database
        with:
          deployment-ref: ${{ steps.validate-manual-preview.outputs.deployment-ref }}
          ephemeral-enabled: ${{ vars.PREVIEW_EPHEMERAL_DB_ENABLED == 'true' }}
          fallback-url: ${{ secrets.PREVIEW_DATABASE_URL }}
          per-pr-base-url: ${{ secrets.PREVIEW_TEST_DATABASE_URL }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Checkout deployment source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.deployment_sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        run: pnpm install

      - name: Route database URL through trusted tunnel
        env:
          RESOLVED_DATABASE_URL: ${{ steps.resolve-preview-database.outputs.database-url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$RESOLVED_DATABASE_URL"
          DATABASE_URL="$RESOLVED_DATABASE_URL" node <<'NODE'
          const fs = require('node:fs');
          const url = new URL(process.env.DATABASE_URL);
          url.hostname = '127.0.0.1';
          url.port = '35432';
          url.searchParams.delete('sslrootcert');
          url.searchParams.set('sslmode', 'require');
          url.searchParams.set('uselibpqcompat', 'true');
          fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${url.toString()}\n`);
          NODE

      - name: Install Playwright browsers (with system deps)
        run: bunx playwright install --with-deps chromium

      - name: Check preview environment
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun scripts/ci/checkPreviewEnv.mts

      - name: Run E2E tests
        working-directory: e2e
        run: pnpm exec cucumber-js --config cucumber.config.js --tags '@P0'
        env:
          E2E_PARALLEL: '1'
          E2E_REPORTS: '0'
          HEADLESS: 'true'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload E2E test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: preview-e2e-artifacts
          path: |
            e2e/reports
            e2e/screenshots
          if-no-files-found: ignore
