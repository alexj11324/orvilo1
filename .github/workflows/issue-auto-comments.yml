name: Issue Auto Comment
on:
  issues:
    types:
      - opened
      - closed
      - assigned
  pull_request_target:
    types:
      - opened
      - closed

permissions:
  contents: read

jobs:
  run:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Auto Comment on Issues Closed
        uses: wow-actions/auto-comment@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          issuesClosed: |
            ✅ @{{ author }}

            This issue is closed, If you have any questions, you can comment and reply.
      - name: Checkout repository
        if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
        uses: actions/checkout@v6

      - name: Check if PR author is maintainer
        if: github.event.pull_request.merged == true
        id: maintainer-check
        run: |
          if [ -f .github/maintainers.txt ] && grep -qx "${{ github.event.pull_request.user.login }}" .github/maintainers.txt; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Auto Comment on Pull Request Merged
        uses: actions-cool/pr-welcome@main
        if: github.event.pull_request.merged == true && steps.maintainer-check.outputs.skip != 'true'
        with:
          token: ${{ secrets.GH_TOKEN }}
          comment: |
            ❤️ Great PR @${{ github.event.pull_request.user.login }} ❤️

            The growth of the project is inseparable from user feedback and contribution — thanks for your contribution!
          emoji: 'hooray'
          pr-emoji: '+1, heart'

