# Completion events reevaluate gates once. Pending checks release the runner.
# Keep workflow_run names in sync when adding checks on commit SHAs.
name: Vercel branch deployment (gated)
'on':
  workflow_run:
    workflows:
      - Affected CI Plan
      - Auto Tag Release
      - Auto-close duplicate issues
      - Build and deploy agent gateway
      - Build and deploy device gateway
      - Build and deploy orvilo1
      - Bundle Analyzer
      - Claude Auto E2E Testing
      - Claude Auto Testing Coverage
      - Claude Code
      - Claude Issue Dedupe
      - Claude Issue Triage
      - Claude Migration Support
      - Claude PR Assign
      - Claude Translate Non-English Comments
      - Claude Translator
      - Daily i18n Update
      - Database Schema Visualization CI
      - Deploy Auth
      - Deploy Workbench
      - Desktop Manual Build
      - Desktop PR Build
      - Docker PR Build
      - Documentation gate tests
      - Documentation requirement
      - E2E CI
      - FTS Search Mapping History
      - Issue Auto Comment
      - Lighthouse Badger
      - Linear tokens
      - Lock Stale Issues
      - MCP Submission Handler
      - Publish Docker Image
      - Release CI
      - Release CLI
      - Release Desktop Beta
      - Release Desktop Canary
      - Release Desktop Stable
      - Release ModelBank
      - Release SDK
      - Revalidate Docs
      - Skeleton requirement
      - Test CI
      - UI alignment
      - Verify Auth
      - Verify Share
      - Verify Workbench
      - "\U0001F504 Branch Synchronization"
    types:
      - completed
  check_run:
    types:
      - completed
  check_suite:
    types:
      - completed
  status: {}
permissions:
  actions: read
  checks: read
  contents: read
  statuses: read
  pull-requests: read
jobs:
  resolve:
    name: Resolve Vercel deployment targets
    if: github.event_name != 'status' || github.event.state != 'pending'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Find current targets for the completed check
        id: targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_MODE: branch
        run: node scripts/ci/vercelGateTargets.mjs
  deploy:
    if: needs.resolve.outputs.targets != '[]'
    name: Deploy Vercel branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ matrix.branch }}
      HEAD_SHA: ${{ matrix.sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      REQUIRED_WORKFLOWS: Test CI,E2E CI
      REQUIRED_CHECK_RUNS: GitGuardian Security Checks
      IGNORED_CHECK_RUNS: Check Duplicate Run,Vercel Preview Comments,Check all PR gates before Vercel,Deploy Vercel Preview,Check all branch gates before Vercel,Deploy Vercel branch,Resolve Vercel deployment targets
      IGNORED_STATUS_CONTEXTS: Vercel
      REQUIRED_EVENT: push
      GATE_SINGLE_PASS: 'true'
    steps:
      - name: Checkout deployment helper
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Evaluate exact-head gates once
        id: gate
        run: node scripts/ci/vercelPreviewGate.mjs
      - name: Reuse an existing exact-head deployment
        id: existing
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/ci/findVercelDeployment.mjs
      - name: Create exact Vercel deployment
        id: deploy
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required}"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          case "$HEAD_BRANCH" in
            main) deployment_target=production ;;
            canary) deployment_target='' ;;
            *)
              echo "Refusing Vercel deployment for unexpected branch: $HEAD_BRANCH" >&2
              exit 1
              ;;
          esac

          current_ref=$(curl -fsS \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_BRANCH}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28')
          if ! jq -e --arg sha "$HEAD_SHA" '.object.type == "commit" and .object.sha == $sha' <<< "$current_ref" > /dev/null; then
            echo "Branch advanced while waiting for gates; refusing a stale Vercel deployment" >&2
            exit 1
          fi

          project=$(curl -fsS \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          project_name=$(jq -er '.name // empty' <<< "$project")
          repository_id=$(jq -er '.link.repoId | select(type == "number")' <<< "$project")
          payload=$(jq -cn \
            --arg branch "$HEAD_BRANCH" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg project_name "$project_name" \
            --arg sha "$HEAD_SHA" \
            --arg target "$deployment_target" \
            --argjson repository_id "$repository_id" '
              {
                gitSource: { ref: $branch, repoId: $repository_id, sha: $sha, type: "github" },
                meta: {
                  githubCommitRef: $branch,
                  githubCommitSha: $sha,
                  githubRepoId: ($repository_id | tostring)
                },
                name: $project_name,
                project: $project,
                projectSettings: { commandForIgnoringBuildStep: "exit 1" }
              }
              + (if $target == "" then {} else { target: $target } end)
            ')

          response_file=$(mktemp)
          http_status=$(curl -sS -o "$response_file" -w '%{http_code}' -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$payload")
          response=$(<"$response_file")
          rm -f "$response_file"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            error_code=$(jq -r '.error.code // "unknown"' <<< "$response")
            error_message=$(jq -r '.error.message // "no message"' <<< "$response")
            echo "Vercel branch deployment creation failed (HTTP $http_status, code=$error_code): $error_message" >&2
            exit 1
          fi

          deployment_id=$(jq -er '.id // .uid // empty' <<< "$response")
          deployment=$(curl -fsS \
            "https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          if ! jq -e \
            --arg branch "$HEAD_BRANCH" \
            --arg project_id "$VERCEL_PROJECT_ID" \
            --arg sha "$HEAD_SHA" \
            --arg target "$deployment_target" \
            --argjson repository_id "$repository_id" '
              .projectId == $project_id
              and .gitSource.type == "github"
              and .gitSource.repoId == $repository_id
              and .gitSource.ref == $branch
              and .gitSource.sha == $sha
              and (if $target == "" then .target == null else .target == $target end)
            ' <<< "$deployment" > /dev/null; then
            echo "Vercel did not confirm an exact deployment for branch=$HEAD_BRANCH sha=$HEAD_SHA" >&2
            exit 1
          fi

          deployment_url=$(jq -er '.url // empty' <<< "$deployment")
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=https://$deployment_url" >> "$GITHUB_OUTPUT"
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.exists != 'true'
      - name: Publish deployment summary
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo "### Vercel branch deployed after all gates"
            echo ""
            echo "- Branch: ${HEAD_BRANCH}"
            echo "- Commit: ${HEAD_SHA}"
            echo "- Deployment: ${DEPLOYMENT_ID}"
            echo "- URL: ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.exists != 'true'
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.targets) }}
    concurrency:
      group: vercel-branch-${{ matrix.pr || matrix.branch }}
      cancel-in-progress: false
