name: Test CI

on: [push, pull_request]

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt out of fail-fast for one push: put `[ci full]` in the head commit
  # message and every job runs to its own verdict, so one run lists every
  # failure instead of only the first. The gate still fails if any job fails.
  CI_RUN_ALL: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ci full]') }}
  # `secrets` is not an allowed context in step `if` conditions; map it once here.
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  # Same-repository PRs use the push check on their head SHA. Do not create a
  # second Required Quality Gate on the merge SHA: even a skipped check would
  # take precedence over the real head check in branch protection.
  changes:
    name: Detect changed areas
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
      code: ${{ steps.plan.outputs.code }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      database: ${{ steps.plan.outputs.database }}
      desktop: ${{ steps.plan.outputs.desktop }}
      packages: ${{ steps.plan.outputs.packages }}
      server: ${{ steps.plan.outputs.server }}
      windows_shell: ${{ steps.plan.outputs.windows_shell }}
      test_packages: ${{ steps.plan.outputs.test_packages }}
      cli: ${{ steps.plan.outputs.cli }}
      coverage: ${{ steps.plan.outputs.coverage }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify CI planning and gate contracts
        run: node --test .github/scripts/plan-affected-checks.test.mjs .github/scripts/run-ci-plan.test.mjs scripts/ci/vercelGateEvents.test.mjs
      - name: Plan affected checks
        id: plan
        run: node .github/scripts/run-ci-plan.mjs

  # Full-repo type-check - CI-only; scripts/type-check.mjs fails fast locally
  # because root `tsgo --noEmit` OOMs developer machines.
  typecheck:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Check authentication tooling
        run: node --test scripts/dockerPrebuild.test.mjs scripts/generate-oidc-jwk.test.mjs

      - name: Typecheck
        # Two runs lost their runner during tsgo without a TypeScript diagnostic.
        # Keep the full check, reduce Go's memory/concurrency pressure, and record
        # resource usage. GOMEMLIMIT is a soft heap target, not a proven OOM fix.
        env:
          GOMEMLIMIT: 4GiB
          GOMAXPROCS: '2'
        run: |
          printf 'Typecheck resources: GOMEMLIMIT=%s GOMAXPROCS=%s\n' "$GOMEMLIMIT" "$GOMAXPROCS"
          free -m
          vmstat -w 15 &
          typecheck_monitor_pid=$!
          trap 'kill "$typecheck_monitor_pid" 2>/dev/null || true; wait "$typecheck_monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time -v pnpm type-check

  # Slimming boundary guard — regenerates the capability census from the
  # working tree and fails when a DELETE capability gains an unexplained
  # inbound dependency (i.e. live code importing a retired surface).
  # Pure Node script: no dependency install needed.
  slimming-boundary:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Slimming Boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Check current repository contracts
        run: |
          node scripts/ci/checkRepositoryContracts.mjs
          node --test scripts/ci/checkRepositoryContracts.test.mjs scripts/repositoryAudit.test.mjs

      - name: Check slimming boundary
        run: node scripts/slimming/census.mjs --check

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true

  # Product-surface controls gate — fails when product .tsx files use raw HTML
  # form controls or ad-hoc control-kit imports instead of the repo design
  # system (ReUI). Exemptions live in scripts/ci/nativeControlsAllowlist.json.
  # Pure Node script: no dependency install needed.
  native-controls:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Native Controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Scan product surfaces for native/ad-hoc controls
        run: |
          node scripts/ci/checkNativeControls.mjs
          node --test scripts/ci/checkNativeControls.test.mjs

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true

  # Pure Node import-graph gate: shared product code must not reach native
  # impls, the web entry closure must not pull exec builtins, server/CLI must
  # not reach apps/desktop. See scripts/ci/checkHostDeviceBoundaries.mjs.
  host-device-boundaries:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Host Device Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install typescript for module resolution
        # The gate resolves real module edges with ts.resolveModuleName; install
        # the repo's pinned typescript into a scratch prefix (no repo install).
        run: |
          TS_VER=$(node -p "require('./package.json').devDependencies.typescript.replace(/^[~^]/, '')")
          npm install --prefix /tmp/hdb-ts --no-save --no-audit --no-fund --loglevel=error "typescript@${TS_VER}"

      - name: Check host/device import boundaries
        env:
          HOST_BOUNDARY_TS_PATH: /tmp/hdb-ts/node_modules/typescript
        run: |
          node scripts/ci/checkHostDeviceBoundaries.mjs
          node --test scripts/ci/checkHostDeviceBoundaries.test.mjs

      - name: Check case-only filename collisions
        # Linux keeps `AgentInfo.tsx` and `agentInfo.ts` apart; macOS and
        # Windows resolve both imports to one file. Only this step catches it.
        run: |
          node scripts/ci/checkCaseOnlyFilenames.mjs
          node --test scripts/ci/checkCaseOnlyFilenames.test.mjs

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true

      # Package tests - all packages in single job to save runner resources

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  test-packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    name: Test Packages
    env:
      PACKAGES: ${{ needs.changes.outputs.test_packages }}

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Install CLI deps
        if: needs.changes.outputs.cli == 'true'
        run: pnpm install
        working-directory: apps/cli

      - name: Test CLI build configuration
        if: needs.changes.outputs.cli == 'true'
        run: bunx vitest run --config vitest.config.mts --silent='passed-only' tsdown.config.test.ts
        working-directory: apps/cli

      - name: Test affected packages
        run: |
          for package in $PACKAGES; do
            echo "::group::Testing $package"
            pnpm --filter "$package" exec vitest run --coverage=${{ needs.changes.outputs.coverage }} --silent='passed-only'
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        if: ${{ always() && needs.changes.outputs.coverage == 'true' && env.CODECOV_TOKEN != '' }}
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Coverage is only uploaded for protected-branch pushes.
          COMMON_ARGS=(--git-service github)
          if [ -n "$CODECOV_TOKEN" ]; then
            COMMON_ARGS+=(-t "$CODECOV_TOKEN")
          fi

          for package in $PACKAGES; do
            dir="${package#@orvilo/}"
            if [ -f "./packages/$dir/coverage/lcov.info" ]; then
              flag="packages/$dir"

              case "$dir" in
                builtin-tool-*)
                  flag="builtin-tools"
                  ;;
                locales|env|device-gateway-client)
                  echo "Skipping Codecov upload for $dir."
                  continue
                  ;;
              esac

              echo "Uploading coverage for $dir as $flag..."
              ./codecov upload-coverage \
                "${COMMON_ARGS[@]}" \
                --file "./packages/$dir/coverage/lcov.info" \
                --flag "$flag" \
                --disable-search
            fi
          done

      # App tests - run sharded tests

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  test-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      # `env` is not available here; same switch as CI_RUN_ALL.
      fail-fast: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[ci full]')) }}
      matrix:
        shard: [1, 2]
    name: Test App (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Enforce original Chinese UI font
        if: matrix.shard == 1
        run: |
          node --import tsx scripts/ci/checkChineseUiFont.mjs
          node --test scripts/ci/checkChineseUiFont.test.mjs

      - name: Run tests
        run: bunx vitest --coverage=${{ needs.changes.outputs.coverage }} --silent='passed-only' --reporter=default ${{ needs.changes.outputs.coverage == 'true' && '--reporter=blob' || '' }} --project app --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() && needs.changes.outputs.coverage == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

      # Merge sharded test reports and upload coverage

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  merge-app-coverage:
    needs: [changes, test-app]
    if: ${{ !cancelled() && needs.changes.outputs.coverage == 'true' && needs.test-app.result == 'success' }}
    name: Merge and Upload App Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: .vitest/blob
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: bunx vitest --merge-reports --reporter=default --coverage

      - name: Upload App Coverage to Codecov
        if: ${{ needs.changes.outputs.coverage == 'true' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/app/lcov.info
          flags: app

  # Windows-only verification of the local shell execution strategy.
  # The unit tests mock process.platform and fs.existsSync, so they prove
  # nothing about real Windows behaviour: argument tokenization by the Windows
  # CRT, Windows PowerShell 5.1 (which lacks `&&`), and the pwsh/5.1/cmd
  # detection cascade against real install paths. The driver script only needs
  # node builtins, so this job skips the monorepo install entirely.
  test-windows-shell:
    needs: changes
    if: needs.changes.outputs.windows_shell == 'true'
    name: Test Windows Shell

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Verify Windows shell strategy
        run: bun run packages/local-file-shell/scripts/verify-windows-shell.ts

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true

  test-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    name: Test Desktop App

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # pnpm 12 writes broken relative symlinks for workspace members outside the desktop
      # workspace root (../../packages/*). Installing the root workspace relinks them so
      # tsgo can resolve sibling packages from source.
      - name: Relink root workspace members
        run: pnpm install --ignore-scripts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Typecheck Desktop
        run: pnpm type-check
        working-directory: apps/desktop

      - name: Test Desktop Client
        run: pnpm test --coverage=${{ needs.changes.outputs.coverage }}
        working-directory: apps/desktop

      - name: Upload Desktop App Coverage to Codecov
        if: ${{ needs.changes.outputs.coverage == 'true' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/desktop/coverage/lcov.info
          flags: desktop

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true

  test-server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    strategy:
      # `env` is not available here; same switch as CI_RUN_ALL.
      fail-fast: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[ci full]')) }}
      matrix:
        shard: [1, 2]
    name: Test Server (shard ${{ matrix.shard }}/2)

    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SLACK_REDIS_TEST_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Test Server Coverage
        run: bunx vitest --coverage=${{ needs.changes.outputs.coverage }} --silent='passed-only' --reporter=default ${{ needs.changes.outputs.coverage == 'true' && '--reporter=blob' || '' }} --coverage.reportsDirectory=./apps/server/coverage --project server --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() && needs.changes.outputs.coverage == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: server-blob-report-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

      # Merge sharded test reports and upload coverage

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  merge-server-coverage:
    needs: [changes, test-server]
    if: ${{ !cancelled() && needs.changes.outputs.coverage == 'true' && needs.test-server.result == 'success' }}
    name: Merge and Upload Server Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: .vitest/blob
          pattern: server-blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: bunx vitest --merge-reports --reporter=default --coverage --coverage.reportsDirectory=./apps/server/coverage

      - name: Upload Server coverage to Codecov
        if: ${{ needs.changes.outputs.coverage == 'true' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/server/coverage/lcov.info
          flags: server

  test-database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    name: Test Database

    runs-on: ubuntu-latest

    services:
      postgres:
        # Pin the image validated by CI; latest introduced an FTS LIMIT regression.
        image: paradedb/paradedb@sha256:52fc9c95fdfd462201168d1d82334ed61f85cbd921957cab083ec39800a217ac
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s  --health-retries 5

        ports:
          - 5432:5432

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm i

      # The service container runs a stock ParadeDB config; on CI runners its
      # checkpoints degrade into multi-minute write storms that starve queries.
      # This is a disposable test database, so trade durability for a fast write
      # path — fsync off and checkpoints spread out. Every setting is
      # SIGHUP-reloadable; `options` can't pass postgres args (they'd be docker
      # args). Same tuning as e2e.yml's "Tune test Postgres for CI" step.
      - name: Tune test Postgres for CI
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # One -c per statement: a multi-statement -c wraps everything in an
          # implicit transaction and ALTER SYSTEM rejects transaction blocks.
          docker exec "$CONTAINER" psql -U postgres -d postgres \
            -c "ALTER SYSTEM SET fsync = 'off'" \
            -c "ALTER SYSTEM SET synchronous_commit = 'off'" \
            -c "ALTER SYSTEM SET full_page_writes = 'off'" \
            -c "ALTER SYSTEM SET checkpoint_timeout = '1800s'" \
            -c "ALTER SYSTEM SET checkpoint_completion_target = '0.9'" \
            -c "ALTER SYSTEM SET max_wal_size = '4GB'" \
            -c "ALTER SYSTEM SET autovacuum = 'off'" \
            -c "SELECT pg_reload_conf()"

      - name: Lint
        run: bun run lint

      - name: Test Coverage
        run: pnpm --filter @orvilo/database exec vitest run --config vitest.config.server.mts --coverage=${{ needs.changes.outputs.coverage }} --silent='passed-only'
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_DRIVER: node
          KEY_VAULTS_SECRET: Kix2wcUONd4CX51E/ZPAd36BqM4wzJgKjPtz2sGztqQ=
          S3_PUBLIC_DOMAIN: https://example.com
          APP_URL: https://home.com

      - name: Upload Database coverage to Codecov
        if: ${{ needs.changes.outputs.coverage == 'true' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/database/coverage/lcov.info
          flags: database

      # Single required check for branch protection and deploy promotion. Branch
      # rules require this one name, so "the tests passed" can never mean "one
      # shard was green while another failed" — a job that failed, was skipped, or
      # never ran keeps the gate red.
      # MAINTENANCE: adding a CI job above requires updating both `needs` here
      # and the `required` list in the step below — a job absent from both is
      # silently excluded from the gate.

      - name: Fail fast — cancel sibling jobs
        if: failure() && env.CI_RUN_ALL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  required-quality-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Push owns quality checks' || 'Required Quality Gate' }}
    needs:
      - changes
      - typecheck
      - slimming-boundary
      - native-controls
      - host-device-boundaries
      - test-packages
      - test-app
      - test-windows-shell
      - test-desktop
      - test-server
      - test-database
      - merge-app-coverage
      - merge-server-coverage
    # always(): a failed upstream must not skip this job — its result IS the
    # failure signal branch protection and the deploy pipeline read.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded for this commit
        env:
          NEEDS: ${{ toJson(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != success ]; then
            echo '::error::Affected check planning did not succeed'
            exit 1
          fi
          required=(
            typecheck
            slimming-boundary
            native-controls
            host-device-boundaries
            test-packages
            test-app
            test-windows-shell
            test-desktop
            test-server
            test-database
            merge-app-coverage
            merge-server-coverage
          )
          # A job skipped because its area filter did not match is a pass —
          # any other non-success keeps the gate red.
          declare -A area_of=(
            [typecheck]=typecheck [slimming-boundary]=code [native-controls]=code [host-device-boundaries]=code [test-packages]=packages [test-app]=app
            [merge-app-coverage]=app [test-windows-shell]=windows_shell
            [test-desktop]=desktop [test-server]=server
            [merge-server-coverage]=server [test-database]=database
          )
          failed=0
          for job in "${required[@]}"; do
            result=$(echo "$NEEDS" | jq -r ".[\"$job\"].result")
            area=${area_of[$job]}
            filter=$(echo "$NEEDS" | jq -r ".changes.outputs.${area} // \"\"")
            if [[ "$job" == merge-*-coverage ]] && [ "$(echo "$NEEDS" | jq -r '.changes.outputs.coverage')" = false ]; then
              filter=false
            fi
            if [ "$result" != "success" ] && ! { [ "$result" = "skipped" ] && [ "$filter" = "false" ]; }; then
              echo "::error::$job: $result (filter ${area}=${filter})"
              failed=1
            else
              echo "$job: $result (filter ${area}=${filter})"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Required jobs failed or were skipped — quality gate stays red."
            exit 1
          fi
