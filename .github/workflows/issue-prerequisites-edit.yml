name: Issue Prerequisites Editing Workspace

on:
  push:
    branches: [feat/issue-prerequisite-gates]
    paths:
      - .github/workflows/issue-prerequisites-edit.yml
      - .github/issue-prerequisites-edit.py

permissions:
  contents: write

concurrency:
  group: issue-prerequisite-gates-edit
  cancel-in-progress: false

jobs:
  workspace:
    if: github.repository == 'alexj11324/orvilo1' && github.ref == 'refs/heads/feat/issue-prerequisite-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply checksum-verified source changes
        id: apply
        run: |
          python3 .github/issue-prerequisites-edit.py
          git add packages src apps locales
          git diff --cached --name-only --diff-filter=ACMR > /tmp/prerequisite-files.txt
      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-env
      - name: Install dependencies
        id: install
        run: pnpm install
      - name: Lint and format changed source
        id: lint
        if: success()
        run: |
          mapfile -t files < /tmp/prerequisite-files.txt
          if [ ${#files[@]} -gt 0 ]; then
            bun run check --lint "${files[@]}"
          fi
      - name: Commit isolated source changes
        if: always() && steps.apply.outcome == 'success'
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages src apps locales
          if ! git diff --cached --quiet; then
            git commit -m '✨ Implement issue prerequisite gating and regression coverage'
            git push origin HEAD:refs/heads/feat/issue-prerequisite-gates
          fi
      - name: Database prerequisite regressions
        if: always() && steps.install.outcome == 'success' && steps.apply.outcome == 'success'
        working-directory: packages/database
        run: bunx vitest run --silent='passed-only' src/models/__tests__/taskDependency.test.ts src/models/__tests__/task.test.ts
      - name: Server and API prerequisite regressions
        if: always() && steps.install.outcome == 'success' && steps.apply.outcome == 'success'
        run: bunx vitest run --project server --silent='passed-only' apps/server/src/services/task/index.test.ts apps/server/src/services/taskGraph/index.test.ts apps/server/src/routers/lambda/__tests__/integration/task.integration.test.ts
      - name: Task UI and selector regressions
        if: always() && steps.install.outcome == 'success' && steps.apply.outcome == 'success'
        run: bunx vitest run --project app --silent='passed-only' src/store/task/selectors/detailSelectors.test.ts src/features/AgentTasks/AgentTaskDetail/TaskDetailRunPauseAction.test.ts src/features/AgentTasks/AgentTaskDetail/TaskDetailHeaderActions.test.tsx
      - name: Full typecheck
        if: always() && steps.install.outcome == 'success' && steps.apply.outcome == 'success'
        run: pnpm type-check
      - name: Export exact branch source and diff
        if: always() && steps.apply.outcome == 'success'
        run: |
          git archive --format=tar HEAD | gzip > /tmp/orvilo1-prerequisites-source.tar.gz
          git diff 4f105fd892a3f2f490878750b4fea2071e0c9bd2 HEAD -- packages src apps locales > /tmp/prerequisites-reviewed.patch
          git rev-parse HEAD > /tmp/prerequisites-head.txt
      - uses: actions/upload-artifact@v6
        if: always() && steps.apply.outcome == 'success'
        with:
          name: issue-prerequisite-gates-source
          path: |
            /tmp/orvilo1-prerequisites-source.tar.gz
            /tmp/prerequisites-reviewed.patch
            /tmp/prerequisites-head.txt
          retention-days: 1
