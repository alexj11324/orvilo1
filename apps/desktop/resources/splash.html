<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orvilo</title>
    <style>
      .drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        -webkit-app-region: drag;
      }

      body {
        margin: 0;
        padding: 48px 0 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #1f1f1f;
        overflow: hidden;
      }

      /* 添加暗色模式支持 */
      @media (prefers-color-scheme: dark) {
        body {
          color: #f5f5f5;
        }
      }

      .container {
        text-align: center;
      }

      .orvilo-brand-loading {
        width: 112px;
        height: auto;
      }

      /* The mark is stroked first (outline traces the arches) and then filled in.
         `pathLength` normalises every arch to 1000 units so the shared
         dasharray / dashoffset keyframes sweep the whole outline regardless of
         how short an individual path is.

         The stroke stays a hairline: the wordmark it replaces was stroked at
         ~0.5px on screen, and anything much thicker bleeds into the gap the
         two arches are designed to leave between them (mark.svg keeps them
         ~4 units apart) and closes the seam. */
      .orvilo-brand-loading path {
        fill: currentcolor;
        fill-opacity: 0%;
        stroke: currentcolor;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        stroke-width: 0.6px;

        animation:
          draw 2s cubic-bezier(0.4, 0, 0.2, 1) infinite,
          fill 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .orvilo-wordmark {
        margin: 1.25rem 0 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        opacity: 0%;

        animation: reveal 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes draw {
        0% {
          stroke-dashoffset: 1000;
        }

        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes fill {
        30% {
          fill-opacity: 5%;
        }

        100% {
          fill-opacity: 100%;
        }
      }

      @keyframes reveal {
        30% {
          opacity: 5%;
        }

        100% {
          opacity: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="drag-bar"></div>
    <div class="container">
      <svg
        class="orvilo-brand-loading"
        fill="currentColor"
        viewBox="0 0 128 128"
        xmlns="http://www.w3.org/2000/svg"
      >
        <title>Orvilo</title>
        <path
          pathLength="1000"
          d="M47 39C48 26 56 20 68 20H85C100 20 108 28 108 43V64C108 79 99 87 86 87H67C79 79 85 70 85 59C85 47 77 39 64 39Z"
        />
        <path
          pathLength="1000"
          d="M81 89C80 102 72 108 60 108H43C28 108 20 100 20 85V64C20 49 29 41 42 41H61C49 49 43 58 43 69C43 81 51 89 64 89Z"
        />
      </svg>
      <p class="orvilo-wordmark">Orvilo</p>
    </div>
  </body>
</html>
