name: Test CI

on: [push, pull_request]

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `secrets` is not an allowed context in step `if` conditions; map it once here.
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  # Check for duplicate runs
  check-duplicate-run:
    name: Check Duplicate Run
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      # The action's output is `reason` — `skip_reason` would always read
      # empty and fail closed even for legitimate completed duplicates.
      skip_reason: ${{ steps.skip_check.outputs.reason }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          # Push runs are the canonical owner: when a PR run and a push run
          # for the same head SHA start within seconds of each other,
          # `same_content_newer` on the push run sees the PR run as the newer
          # sibling and cancels itself — while the PR run also skips its
          # leafs and only mirrors a verdict. Both runs then die untested and
          # the PR gate mirrors the cancelled owner's failure. Pinning push to
          # do_not_skip gives the pair a deterministic owner: the push run
          # always executes, the PR run always mirrors it.
          do_not_skip: '["push", "workflow_dispatch", "schedule"]'
          # do_not_skip alone does not save the push run: the PR run's
          # concurrent_skipping check still issues a cancel on its "duplicate"
          # sibling ~80s in, killing every leaf job mid-flight — the PR gate
          # then mirrors the murdered owner's failure. With push pinned as the
          # canonical owner there is nothing to cancel: PR leafs skip via
          # should_skip and only the mirror gate follows the push verdict.
          cancel_others: 'false'

  # Path triage — one cheap job diffs the PR and reports which test areas
  # actually need to run. Leaf jobs skip when their area is untouched, and the
  # quality gate accepts a *filter* skip while still failing on any other.
  changes:
    name: Detect changed areas
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      code: ${{ steps.filter.outputs.code }}
      database: ${{ steps.filter.outputs.database }}
      desktop: ${{ steps.filter.outputs.desktop }}
      packages: ${{ steps.filter.outputs.packages }}
      server: ${{ steps.filter.outputs.server }}
      windows_shell: ${{ steps.filter.outputs.windows_shell }}
    steps:
      # paths-filter runs `git` to resolve the current ref and, on push runs,
      # diffs the before..after SHAs locally — a checkout with full history is
      # required. A tag/first push with no resolvable base reports every area
      # changed (full coverage).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'vitest.config.mts'
              - 'scripts/**'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.mts'
              - '**/*.cts'
              - '**/*.sql'
            packages:
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'vitest.config.mts'
              - 'scripts/**'
              - 'packages/**'
            app:
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'vitest.config.mts'
              - 'scripts/**'
              - 'packages/**'
              - 'src/**'
              - 'apps/server/**'
              - 'public/**'
              - 'locales/**'
            server:
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'vitest.config.mts'
              - 'scripts/**'
              - 'packages/**'
              - 'apps/server/**'
            desktop:
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'vitest.config.mts'
              - 'scripts/**'
              - 'packages/**'
              - 'apps/desktop/**'
            windows_shell:
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'vitest.config.mts'
              - 'scripts/**'
              - 'packages/local-file-shell/**'
            database:
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'vitest.config.mts'
              - 'scripts/**'
              - 'packages/database/**'

  # Full-repo type-check - CI-only; scripts/type-check.mjs fails fast locally
  # because root `tsgo --noEmit` OOMs developer machines.
  typecheck:
    needs: [check-duplicate-run, changes]
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && needs.changes.outputs.code == 'true'
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Typecheck
        run: pnpm type-check

  # Slimming boundary guard — regenerates the capability census from the
  # working tree and fails when a DELETE capability gains an unexplained
  # inbound dependency (i.e. live code importing a retired surface).
  # Pure Node script: no dependency install needed.
  slimming-boundary:
    needs: [check-duplicate-run, changes]
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && needs.changes.outputs.code == 'true'
    name: Slimming Boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Check slimming boundary
        run: node scripts/slimming/census.mjs --check

      - name: Fail fast — cancel sibling jobs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true

  # Package tests - all packages in single job to save runner resources

      - name: Fail fast — cancel sibling jobs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  test-packages:
    needs: [check-duplicate-run, changes]
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    name: Test Packages
    env:
      PACKAGES: '@orvilo/file-loaders @orvilo/prompts @orvilo/model-runtime @orvilo/web-crawler @orvilo/electron-server-ipc @orvilo/utils @orvilo/context-engine @orvilo/agent-execution @orvilo/conversation-flow @orvilo/ssrf-safe-fetch @orvilo/memory-user-memory @orvilo/types @orvilo/trpc @orvilo/app-config @orvilo/locales @orvilo/env @orvilo/builtin-tool-orvilo-agent model-bank @orvilo/agent-gateway-client @orvilo/agent-manager-runtime @orvilo/device-gateway-client @orvilo/device-identity @orvilo/eval-dataset-parser @orvilo/eval-rubric @orvilo/fetch-sse @orvilo/heterogeneous-agents'

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Install CLI deps
        run: pnpm install
        working-directory: apps/cli

      - name: Test CLI build configuration
        run: bunx vitest run --config vitest.config.mts --silent='passed-only' tsdown.config.test.ts
        working-directory: apps/cli

      - name: Test packages with coverage
        run: |
          for package in $PACKAGES; do
            echo "::group::Testing $package"
            bun run --filter $package test:coverage
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Build common args
          COMMON_ARGS="--git-service github"

          # PR args setup
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMON_ARGS="$COMMON_ARGS --pr ${{ github.event.pull_request.number }}"
            COMMON_ARGS="$COMMON_ARGS --sha ${{ github.event.pull_request.head.sha }}"
            # Fork PR needs username:branch format for tokenless upload
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              COMMON_ARGS="$COMMON_ARGS --branch ${{ github.event.pull_request.head.label }}"
            else
              COMMON_ARGS="$COMMON_ARGS --branch ${{ github.event.pull_request.head.ref }}"
            fi
          fi

          # Token (if available)
          if [ -n "$CODECOV_TOKEN" ]; then
            COMMON_ARGS="$COMMON_ARGS -t $CODECOV_TOKEN"
          fi

          for package in $PACKAGES; do
            dir="${package#@orvilo/}"
            if [ -f "./packages/$dir/coverage/lcov.info" ]; then
              flag="packages/$dir"

              case "$dir" in
                builtin-tool-*)
                  flag="builtin-tools"
                  ;;
                locales|env|device-gateway-client)
                  echo "Skipping Codecov upload for $dir."
                  continue
                  ;;
              esac

              echo "Uploading coverage for $dir as $flag..."
              ./codecov upload-coverage \
                $COMMON_ARGS \
                --file ./packages/$dir/coverage/lcov.info \
                --flag "$flag" \
                --disable-search
            fi
          done

  # App tests - run sharded tests

      - name: Fail fast — cancel sibling jobs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  test-app:
    needs: [check-duplicate-run, changes]
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && needs.changes.outputs.app == 'true'
    strategy:
      matrix:
        shard: [1, 2]
    name: Test App (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Enforce original Chinese UI font
        if: matrix.shard == 1
        run: |
          node --import tsx scripts/ci/checkChineseUiFont.mjs
          node --test scripts/ci/checkChineseUiFont.test.mjs

      - name: Run tests
        run: bunx vitest --coverage --silent='passed-only' --reporter=default --reporter=blob --project app --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

  # Merge sharded test reports and upload coverage

      - name: Fail fast — cancel sibling jobs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  merge-app-coverage:
    needs: test-app
    if: ${{ !cancelled() && needs.test-app.result == 'success' }}
    name: Merge and Upload App Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: .vitest/blob
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: bunx vitest --merge-reports --reporter=default --coverage

      - name: Upload App Coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/app/lcov.info
          flags: app

  # Windows-only verification of the local shell execution strategy.
  # The unit tests mock process.platform and fs.existsSync, so they prove
  # nothing about real Windows behaviour: argument tokenization by the Windows
  # CRT, Windows PowerShell 5.1 (which lacks `&&`), and the pwsh/5.1/cmd
  # detection cascade against real install paths. The driver script only needs
  # node builtins, so this job skips the monorepo install entirely.
  test-windows-shell:
    needs: [check-duplicate-run, changes]
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && needs.changes.outputs.windows_shell == 'true'
    name: Test Windows Shell

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Verify Windows shell strategy
        run: bun run packages/local-file-shell/scripts/verify-windows-shell.ts

      - name: Fail fast — cancel sibling jobs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true

  test-desktop:
    needs: [check-duplicate-run, changes]
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && needs.changes.outputs.desktop == 'true'
    name: Test Desktop App

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # pnpm 12 writes broken relative symlinks for workspace members outside the desktop
      # workspace root (../../packages/*). Installing the root workspace relinks them so
      # tsgo can resolve sibling packages from source.
      - name: Relink root workspace members
        run: pnpm install --ignore-scripts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Typecheck Desktop
        run: pnpm type-check
        working-directory: apps/desktop

      - name: Test Desktop Client
        run: pnpm test
        working-directory: apps/desktop

      - name: Upload Desktop App Coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/desktop/coverage/lcov.info
          flags: desktop

      - name: Fail fast — cancel sibling jobs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true

  test-server:
    needs: [check-duplicate-run, changes]
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && needs.changes.outputs.server == 'true'
    strategy:
      matrix:
        shard: [1, 2]
    name: Test Server (shard ${{ matrix.shard }}/2)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Test Server Coverage
        run: bunx vitest --coverage --silent='passed-only' --reporter=default --reporter=blob --coverage.reportsDirectory=./apps/server/coverage --project server --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: server-blob-report-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

  # Merge sharded test reports and upload coverage

      - name: Fail fast — cancel sibling jobs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A failing leaf means the run's verdict is already known: cancel
        # the rest instead of burning runner minutes to the same red gate.
        # The gate job lands cancelled, which still reports red to branch
        # protection. Vercel deploys run outside Actions and are untouched.
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  merge-server-coverage:
    needs: test-server
    if: ${{ !cancelled() && needs.test-server.result == 'success' }}
    name: Merge and Upload Server Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: .vitest/blob
          pattern: server-blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: bunx vitest --merge-reports --reporter=default --coverage --coverage.reportsDirectory=./apps/server/coverage

      - name: Upload Server coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/server/coverage/lcov.info
          flags: server

  test-database:
    needs: [check-duplicate-run, changes]
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && needs.changes.outputs.database == 'true'
    name: Test Database

    runs-on: ubuntu-latest

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s  --health-retries 5

        ports:
          - 5432:5432

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm i

      # The service container runs a stock ParadeDB config; on CI runners its
      # checkpoints degrade into multi-minute write storms that starve queries.
      # This is a disposable test database, so trade durability for a fast write
      # path — fsync off and checkpoints spread out. Every setting is
      # SIGHUP-reloadable; `options` can't pass postgres args (they'd be docker
      # args). Same tuning as e2e.yml's "Tune test Postgres for CI" step.
      - name: Tune test Postgres for CI
        run: |
          CONTAINER=$(docker ps --filter "ancestor=paradedb/paradedb:latest" --format '{{.ID}}')
          # One -c per statement: a multi-statement -c wraps everything in an
          # implicit transaction and ALTER SYSTEM rejects transaction blocks.
          docker exec "$CONTAINER" psql -U postgres -d postgres \
            -c "ALTER SYSTEM SET fsync = 'off'" \
            -c "ALTER SYSTEM SET synchronous_commit = 'off'" \
            -c "ALTER SYSTEM SET full_page_writes = 'off'" \
            -c "ALTER SYSTEM SET checkpoint_timeout = '1800s'" \
