server {
    listen 443 ssl;
    server_name qa-permission.aspectlylabs.com;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    client_max_body_size 101m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    location /_qa/device-gateway/ { proxy_pass http://127.0.0.1:13288/; }
    location /_qa/agent-gateway/ { proxy_pass http://127.0.0.1:13287/; }
    location = /_qa/collaboration { proxy_pass http://127.0.0.1:13212/collaboration; }
    location /qa-permission-20261008/ { proxy_pass http://127.0.0.1:13251; }
    location / { proxy_pass http://127.0.0.1:13210; }
}
