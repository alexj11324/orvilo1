name: Resolve Preview database
description: Resolve the restricted database URL used by Preview validation

inputs:
  deployment-ref:
    description: Vercel/Git deployment branch ref; empty for shared Preview validation
    required: false
  ephemeral-enabled:
    description: Whether this repository provisions per-PR Preview databases
    required: true
  fallback-url:
    description: Restricted shared Preview database URL
    required: true
  per-pr-base-url:
    description: Restricted CI role URL whose database name is replaced for per-PR validation
    required: false

outputs:
  database-url:
    description: The resolved restricted Preview database URL
    value: ${{ steps.resolve.outputs.database-url }}

runs:
  using: composite
  steps:
    - name: Resolve restricted Preview database URL
      id: resolve
      shell: bash
      env:
        DEPLOYMENT_REF: ${{ inputs.deployment-ref }}
        EPHEMERAL_ENABLED: ${{ inputs.ephemeral-enabled }}
        FALLBACK_URL: ${{ inputs.fallback-url }}
        PER_PR_BASE_URL: ${{ inputs.per-pr-base-url }}
      run: |
        set -euo pipefail

        for candidate in "$FALLBACK_URL" "$PER_PR_BASE_URL"; do
          if [[ "$candidate" == *$'\n'* || "$candidate" == *$'\r'* ]]; then
            echo "database URL contains a newline" >&2
            exit 1
          fi
          [[ -z "$candidate" ]] || echo "::add-mask::$candidate"
        done

        resolved_url="$FALLBACK_URL"
        database_source="shared Preview fallback"
        if [[ -n "$DEPLOYMENT_REF" && "$EPHEMERAL_ENABLED" == "true" ]]; then
          : "${PER_PR_BASE_URL:?PREVIEW_TEST_DATABASE_URL is required for per-PR validation}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required to resolve the Preview PR number}"
          : "${GITHUB_API_URL:?GITHUB_API_URL is required to resolve the Preview PR number}"
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required to resolve the Preview PR number}"
          : "${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER is required to resolve the Preview PR number}"
          echo "::add-mask::$GITHUB_TOKEN"

          pull_requests=$(curl -fsS --get \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls" \
            --data-urlencode 'state=open' \
            --data-urlencode "head=${GITHUB_REPOSITORY_OWNER}:${DEPLOYMENT_REF}" \
            --data-urlencode 'per_page=100' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28')
          pr_numbers=$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg branch "$DEPLOYMENT_REF" '
            [.[]?
              | select(.head.repo.full_name == $repo)
              | select(.head.ref == $branch)
              | .number
            ]
          ' <<< "$pull_requests")
          if [[ "$(jq 'length' <<< "$pr_numbers")" != "1" ]]; then
            echo "expected exactly one open PR for branch=$DEPLOYMENT_REF" >&2
            exit 1
          fi
          pr_number=$(jq -er '.[0]' <<< "$pr_numbers")
          resolved_url=$(BASE_URL="$PER_PR_BASE_URL" PR_NUMBER="$pr_number" node <<'NODE'
          const url = new URL(process.env.BASE_URL);
          if (!/^\d+$/.test(process.env.PR_NUMBER)) throw new Error('invalid PR number');
          url.pathname = `/orvilo_pr_${process.env.PR_NUMBER}`;
          process.stdout.write(url.href);
        NODE
          )
          database_source="restricted CI role for PR #$pr_number"
        fi

        if [[ -z "$resolved_url" ]]; then
          echo "no restricted Preview database URL is available" >&2
          exit 1
        fi
        echo "::add-mask::$resolved_url"

        database_metadata=$(RESOLVED_URL="$resolved_url" node <<'NODE'
        const url = new URL(process.env.RESOLVED_URL);
        if (!['postgres:', 'postgresql:'].includes(url.protocol) || !url.hostname || !url.username || !url.password) {
          throw new Error('DATABASE_URL must be a PostgreSQL URL with credentials');
        }
        const database = decodeURIComponent(url.pathname.replace(/^\/+/, ''));
        if (!database) throw new Error('DATABASE_URL must include a database name');
        process.stdout.write(JSON.stringify({ hostname: url.hostname, database }));
        NODE
        )
        database_host=$(jq -er '.hostname' <<< "$database_metadata")
        database_name=$(jq -er '.database' <<< "$database_metadata")

        printf 'database-url=%s\n' "$resolved_url" >> "$GITHUB_OUTPUT"
        echo "resolved database source=$database_source host=$database_host database=$database_name"
