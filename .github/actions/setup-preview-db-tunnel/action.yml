name: Setup Preview database tunnel
description: Route Preview CI database access through the OCI host SSH endpoint

inputs:
  database-url:
    description: Preview PostgreSQL connection string
    required: true
  oracle-host:
    description: OCI host reachable over SSH
    required: true
  oracle-known-hosts:
    description: Pinned SSH known_hosts entries for the OCI host
    required: true
  oracle-ssh-key:
    description: SSH private key for the OCI host
    required: true

runs:
  using: composite
  steps:
    - name: Open SSH tunnel
      shell: bash
      env:
        ORACLE_HOST: ${{ inputs.oracle-host }}
        ORACLE_KNOWN_HOSTS: ${{ inputs.oracle-known-hosts }}
        ORACLE_SSH_KEY: ${{ inputs.oracle-ssh-key }}
      run: |
        set -euo pipefail

        ssh_dir="$RUNNER_TEMP/orvilo-preview-ssh"
        install -d -m 700 "$ssh_dir"
        printf '%s\n' "$ORACLE_SSH_KEY" > "$ssh_dir/id_ed25519"
        printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
        chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"

        ssh \
          -i "$ssh_dir/id_ed25519" \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          -o ExitOnForwardFailure=yes \
          -o IdentitiesOnly=yes \
          -o ServerAliveCountMax=3 \
          -o ServerAliveInterval=30 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$ssh_dir/known_hosts" \
          -fNT \
          -L 127.0.0.1:35432:127.0.0.1:25432 \
          "ubuntu@$ORACLE_HOST"

    - name: Route PostgreSQL through the tunnel
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');

        const url = new URL(process.env.DATABASE_URL);
        url.hostname = '127.0.0.1';
        url.port = '35432';

        if (url.searchParams.get('sslmode') === 'require' && !url.searchParams.has('uselibpqcompat')) {
          url.searchParams.set('uselibpqcompat', 'true');
        }

        fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${url.toString()}\n`);
        NODE
