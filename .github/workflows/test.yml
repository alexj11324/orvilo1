name: Test CI

on: [push, pull_request]

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `secrets` is not an allowed context in step `if` conditions; map it once here.
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  # Check for duplicate runs
  check-duplicate-run:
    name: Check Duplicate Run
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["workflow_dispatch", "schedule"]'

  # Full-repo type-check - CI-only; scripts/type-check.mjs fails fast locally
  # because root `tsgo --noEmit` OOMs developer machines.
  typecheck:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Typecheck
        run: pnpm type-check

  # Package tests - all packages in single job to save runner resources
  test-packages:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    name: Test Packages
    env:
      PACKAGES: '@orvilo/file-loaders @orvilo/prompts @orvilo/model-runtime @orvilo/web-crawler @orvilo/electron-server-ipc @orvilo/utils @orvilo/context-engine @orvilo/agent-runtime @orvilo/conversation-flow @orvilo/ssrf-safe-fetch @orvilo/memory-user-memory @orvilo/types @orvilo/trpc @orvilo/app-config @orvilo/locales @orvilo/env @orvilo/builtin-tool-orvilo-agent model-bank @orvilo/agent-gateway-client @orvilo/agent-manager-runtime @orvilo/device-gateway-client @orvilo/device-identity @orvilo/eval-dataset-parser @orvilo/eval-rubric @orvilo/fetch-sse @orvilo/heterogeneous-agents'

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Install CLI deps
        run: pnpm install
        working-directory: apps/cli

      - name: Test CLI build configuration
        run: bunx vitest run --config vitest.config.mts --silent='passed-only' tsdown.config.test.ts
        working-directory: apps/cli

      - name: Test packages with coverage
        run: |
          for package in $PACKAGES; do
            echo "::group::Testing $package"
            bun run --filter $package test:coverage
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        env:
          # Event fields a PR author can influence are passed through the
          # environment instead of being interpolated into the script body: a
          # branch name may contain characters that would escape the quoting.
          HEAD_LABEL: ${{ github.event.pull_request.head.label }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Build common args
          COMMON_ARGS="--git-service github"

          # PR args setup
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            COMMON_ARGS="$COMMON_ARGS --pr $PR_NUMBER"
            COMMON_ARGS="$COMMON_ARGS --sha $HEAD_SHA"
            # Fork PR needs username:branch format for tokenless upload
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              COMMON_ARGS="$COMMON_ARGS --branch $HEAD_LABEL"
            else
              COMMON_ARGS="$COMMON_ARGS --branch $HEAD_REF"
            fi
          fi

          # Token (if available)
          if [ -n "$CODECOV_TOKEN" ]; then
            COMMON_ARGS="$COMMON_ARGS -t $CODECOV_TOKEN"
          fi

          for package in $PACKAGES; do
            dir="${package#@orvilo/}"
            if [ -f "./packages/$dir/coverage/lcov.info" ]; then
              flag="packages/$dir"

              case "$dir" in
                builtin-tool-*)
                  flag="builtin-tools"
                  ;;
                locales|env|device-gateway-client)
                  echo "Skipping Codecov upload for $dir."
                  continue
                  ;;
              esac

              echo "Uploading coverage for $dir as $flag..."
              ./codecov upload-coverage \
                $COMMON_ARGS \
                --file ./packages/$dir/coverage/lcov.info \
                --flag "$flag" \
                --disable-search
            fi
          done

  # App tests - run sharded tests
  test-app:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    strategy:
      matrix:
        shard: [1, 2]
    name: Test App (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Run tests
        run: bunx vitest --coverage --silent='passed-only' --reporter=default --reporter=blob --project app --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

  # Merge sharded test reports and upload coverage
  merge-app-coverage:
    needs: test-app
    if: ${{ !cancelled() && needs.test-app.result == 'success' }}
    name: Merge and Upload App Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: .vitest/blob
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: bunx vitest --merge-reports --reporter=default --coverage

      - name: Upload App Coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/app/lcov.info
          flags: app

  # Windows-only verification of the local shell execution strategy.
  # The unit tests mock process.platform and fs.existsSync, so they prove
  # nothing about real Windows behaviour: argument tokenization by the Windows
  # CRT, Windows PowerShell 5.1 (which lacks `&&`), and the pwsh/5.1/cmd
  # detection cascade against real install paths. The driver script only needs
  # node builtins, so this job skips the monorepo install entirely.
  test-windows-shell:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    name: Test Windows Shell

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Verify Windows shell strategy
        run: bun run packages/local-file-shell/scripts/verify-windows-shell.ts

  test-desktop:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    name: Test Desktop App

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # pnpm 12 writes broken relative symlinks for workspace members outside the desktop
      # workspace root (../../packages/*). Installing the root workspace relinks them so
      # tsgo can resolve sibling packages from source.
      - name: Relink root workspace members
        run: pnpm install --ignore-scripts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Typecheck Desktop
        run: pnpm type-check
        working-directory: apps/desktop

      - name: Test Desktop Client
        run: pnpm test
        working-directory: apps/desktop

      - name: Upload Desktop App Coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/desktop/coverage/lcov.info
          flags: desktop

  test-server:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    strategy:
      matrix:
        shard: [1, 2]
    name: Test Server (shard ${{ matrix.shard }}/2)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Test Server Coverage
        run: bunx vitest --coverage --silent='passed-only' --reporter=default --reporter=blob --coverage.reportsDirectory=./apps/server/coverage --project server --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: server-blob-report-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

  # Merge sharded test reports and upload coverage
  merge-server-coverage:
    needs: test-server
    if: ${{ !cancelled() && needs.test-server.result == 'success' }}
    name: Merge and Upload Server Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: .vitest/blob
          pattern: server-blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: bunx vitest --merge-reports --reporter=default --coverage --coverage.reportsDirectory=./apps/server/coverage

      - name: Upload Server coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/server/coverage/lcov.info
          flags: server

  test-databsae:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    name: Test Database

    runs-on: ubuntu-latest

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s  --health-retries 5

        ports:
          - 5432:5432

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm i

      - name: Lint
        run: bun run lint

      - name: Test Coverage
        run: pnpm --filter @orvilo/database test:coverage
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_DRIVER: node
          KEY_VAULTS_SECRET: Kix2wcUONd4CX51E/ZPAd36BqM4wzJgKjPtz2sGztqQ=
          S3_PUBLIC_DOMAIN: https://example.com
          APP_URL: https://home.com

      - name: Upload Database coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/database/coverage/lcov.info
          flags: database
