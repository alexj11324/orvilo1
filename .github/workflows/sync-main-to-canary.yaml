name: 🔄 Branch Synchronization

# Brings `main` back into `canary` after a release lands, so the two lines do
# not drift apart.
#
# It opens a pull request rather than pushing. The original version tried a
# fast-forward push, fell back to a merge push, and only opened a PR when both
# failed — but `canary` is covered by the `trunk-branches` ruleset, which
# forbids direct pushes, and a personal-account repository ruleset cannot grant
# GitHub Actions a bypass. So every direct-push path was going to be rejected;
# the PR path is the only one that works.
#
# The PR is deliberately NOT auto-merged. canary and main have drifted (179
# conflicted files as of 2026-09-18), so a merge normally needs a human to
# resolve it. Auto-merging would either fail or silently pick a side.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-canary
  cancel-in-progress: true

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name 'orvilobot'
          git config user.email 'i@orvilo.aspectlylabs.com'

      # NOTE: this uses the built-in GITHUB_TOKEN, which is enough to push the
      # sync branch (it is not protected) and to open the PR. The trade-off is
      # that PR workflows require a maintainer to approve their runs. Review
      # and pass those checks before merging; this workflow never auto-merges.
      - name: Open or refresh the sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin canary main

          if git merge-base --is-ancestor origin/main origin/canary; then
            echo "canary already contains main — nothing to sync."
            exit 0
          fi

          # Keep at most one open sync PR; refresh it instead of stacking more.
          EXISTING_PR=$(gh pr list --base canary --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("sync/main-to-canary-"))][0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            gh pr comment "$EXISTING_PR" \
              --body "New commits landed on \`main\`. Pull \`origin/main\` into this branch to include them."
            echo "Refreshed existing sync PR #$EXISTING_PR"
            exit 0
          fi

          SYNC_BRANCH="sync/main-to-canary-$(date +'%Y%m%d')-${GITHUB_RUN_ID}"
          git checkout -B "$SYNC_BRANCH" origin/canary
          PR_OPTIONS=()
          RESOLUTION_NOTE="The merge is clean. Review and pass CI before merging."

          if git merge origin/main --no-edit; then
            echo "Merge is clean."
          else
            # Never commit conflict markers. Keep main's actual tree so GitHub
            # can detect the conflicts against canary on a draft pull request.
            git merge --abort
            git checkout -B "$SYNC_BRANCH" origin/main
            PR_OPTIONS=(--draft)
            RESOLUTION_NOTE="This draft preserves main's tree because the merge conflicts. Merge origin/canary into this branch, resolve each conflict, commit, push, and pass CI before marking it ready."
            echo "Merge has conflicts — opening a draft for manual resolution."
          fi

          git push origin "$SYNC_BRANCH"

          gh pr create \
            "${PR_OPTIONS[@]}" \
            --base canary \
            --head "$SYNC_BRANCH" \
            --title "🔄 sync: main → canary" \
            --body "Automatic sync of \`main\` back into \`canary\`.

          $RESOLUTION_NOTE

          Workflows opened with GITHUB_TOKEN require a maintainer to approve their runs. Do not merge without passing CI."

          echo "✅ Opened sync PR from $SYNC_BRANCH"
