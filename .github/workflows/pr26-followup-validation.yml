name: PR26 Follow-up Validation
on:
  push:
    branches: [fix/task-pr-audit-20260916]
    paths: [.github/workflows/pr26-followup-validation.yml]
permissions:
  contents: write
concurrency:
  group: pr26-followup-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_DRIVER: node
      TEST_SERVER_DB: '1'
      S3_PUBLIC_DOMAIN: https://example.com
      APP_URL: https://home.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: ./.github/actions/setup-env
      - name: Load public development test secret
        run: echo "KEY_VAULTS_SECRET=$(grep '^KEY_VAULTS_SECRET=' .env.example.development | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install
      - name: Apply follow-up fixes
        run: python .agents/tmp/pr26-followup-fix.py
      - name: Focused lint
        run: bun run check --lint packages/database/src/models/task.ts packages/database/src/models/__tests__/taskDependency.test.ts
      - name: Database prerequisite regressions
        working-directory: packages/database
        run: bunx vitest run --no-file-parallelism --silent='passed-only' src/models/__tests__/taskDependency.test.ts src/models/__tests__/taskInterruptedRun.test.ts
      - name: Migration metadata checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = Path('packages/database/migrations/meta')
          journal = json.loads((meta / '_journal.json').read_text())
          assert journal['entries'][-1]['idx'] == 169
          assert journal['entries'][-1]['tag'] == '0169_task_dependency_ownership'
          previous = json.loads((meta / '0168_snapshot.json').read_text())
          current = json.loads((meta / '0169_snapshot.json').read_text())
          assert current['prevId'] == previous['id']
          assert current['id'] != previous['id']
          previous_schema = {k: v for k, v in previous.items() if k not in ('id', 'prevId')}
          current_schema = {k: v for k, v in current.items() if k not in ('id', 'prevId')}
          assert current_schema == previous_schema
          print('migration journal and snapshot chain valid')
          PY
      - name: Full repository typecheck
        run: pnpm type-check
      - name: Commit verified fixes and remove temporary harness
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Delivery Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .agents/tmp/pr26-followup-fix.py .github/workflows/pr26-followup-validation.yml
          git add packages/database/src/models/task.ts packages/database/src/models/__tests__/taskDependency.test.ts packages/database/migrations/meta/0169_snapshot.json
          git diff --cached --check
          git commit -m '🐛 fix(tasks): fence private dependency dispatch'
          git push origin HEAD:fix/task-pr-audit-20260916
