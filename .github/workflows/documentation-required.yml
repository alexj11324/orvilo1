name: Documentation requirement

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  documentation-required:
    name: Documentation Required
    runs-on: ubuntu-latest
    # Release-automation PRs are mechanical: release/* cuts carry the canary
    # snapshot to main, sync/* back-syncs carry the post-merge version bump to
    # canary — neither should trip the docs gate on package.json alone.
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      !startsWith(github.event.pull_request.head.ref, 'sync/')
    steps:
      # pull_request_target runs this workflow from the protected base branch.
      # Do not check out or execute code from the PR: otherwise a PR could
      # alter its own required check.
      - uses: actions/checkout@v6

      - name: Require docs for functional source changes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/require-docs-for-functional-changes.mjs
