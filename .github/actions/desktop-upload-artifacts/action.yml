name: Desktop Upload Artifacts
description: Rename macOS yml for multi-arch and upload build artifacts

inputs:
  artifact-name:
    description: Name for the uploaded artifact
    required: true
  retention-days:
    description: Number of days to retain artifacts
    required: false
    default: '5'

runs:
  using: composite
  steps:
    - name: Validate renderer OTA base hash
      shell: bash
      run: |
        set -euo pipefail
        MAIN_HASH=$(cat apps/desktop/release/renderer-mainhash.txt)
        if [[ ! "$MAIN_HASH" =~ ^[0-9a-f]{64}$ ]]; then
          echo "Invalid renderer OTA main bundle hash"
          exit 1
        fi
        node --input-type=module <<'NODE'
        import { readFile, mkdir, writeFile } from 'node:fs/promises';
        import { validateInputManifest } from './apps/desktop/scripts/validateMainHash.mjs';
        const release = 'apps/desktop/release';
        const manifest = JSON.parse(await readFile(`${release}/renderer-mainhash-inputs.json`, 'utf8'));
        validateInputManifest(manifest);
        const embedded = (await readFile(`${release}/renderer-mainhash.txt`, 'utf8')).trim();
        if (embedded !== manifest.mainHash) throw new Error('Packaged hash differs from source inputs');
        await mkdir(`${release}/renderer-mainhash`, { recursive: true });
        await writeFile(`${release}/renderer-mainhash/${process.env.ARTIFACT_NAME}.json`, JSON.stringify(manifest, null, 2));
        NODE
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}

    - name: Rename macOS *-mac.yml for multi-architecture support
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cd apps/desktop/release
        SYSTEM_ARCH=$(uname -m)
        if [[ "$SYSTEM_ARCH" == "arm64" ]]; then
          ARCH_SUFFIX="arm64"
        else
          ARCH_SUFFIX="x64"
        fi
        for yml in *-mac.yml; do
          if [ -f "$yml" ]; then
            new_name="${yml%.yml}-${ARCH_SUFFIX}.yml"
            mv "$yml" "$new_name"
            echo "✅ Renamed $yml to $new_name"
          fi
        done

    - name: List yml files before upload
      shell: bash
      run: |
        echo "📋 YML files to upload:"
        ls -la apps/desktop/release/*.yml 2>/dev/null || echo "   ⚠️ No yml files found!"

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        if-no-files-found: warn
        path: |
          apps/desktop/release/*.yml
          apps/desktop/release/*.dmg*
          apps/desktop/release/*.zip*
          apps/desktop/release/*.exe*
          apps/desktop/release/*.AppImage
          apps/desktop/release/*.deb*
          apps/desktop/release/*.snap*
          apps/desktop/release/*.rpm*
          apps/desktop/release/*.tar.gz*
          apps/desktop/release/renderer-mainhash/
        retention-days: ${{ inputs.retention-days }}
