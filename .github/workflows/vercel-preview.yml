name: Vercel Preview Deploy (gated)

# Vercel Git integration only auto-deploys `canary`/`main` (see vercel.json
# git.deploymentEnabled) so preview builds stop burning the daily quota on
# every push. PR previews are instead triggered here — only after the whole
# Test CI workflow (typecheck + all test shards) is green for the PR head.
#
# Setup: create a Vercel Deploy Hook in the project settings and store it as
# the `VERCEL_PREVIEW_DEPLOY_HOOK` secret. While the secret is absent this
# workflow no-ops.
#
# NOTE: `workflow_run` triggers register only once this file exists on the
# default branch (main), so it activates after the next canary -> main sync.

on:
  workflow_run:
    workflows: ['Test CI']
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Trigger Vercel preview
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Call Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_PREVIEW_DEPLOY_HOOK }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::notice::VERCEL_PREVIEW_DEPLOY_HOOK secret not set - skipping preview deploy for $HEAD_BRANCH"
            exit 0
          fi
          echo "Deploying Vercel preview for $HEAD_BRANCH ($HEAD_SHA)"
          curl -sf -X POST "$VERCEL_DEPLOY_HOOK?ref=$HEAD_BRANCH"
